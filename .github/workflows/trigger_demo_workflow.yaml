name: Trigger Deploy to Demo
run-name: Trigger Deploy by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      service:
        type: choice
        description: "The service you want to deploy"
        required: true
        default: dibbs-landing
        options:
          - dibbs-landing
      version:
        type: string
        description: "The version to deploy. Example: v2.6.0 or main"
        required: true
        default: main
      event_type:
        type: choice
        description: "The event type to trigger the workflow."
        required: true
        options:
          - trigger-demo-plan
          - trigger-demo-deploy

permissions:
  contents: read

jobs:
  trigger_demo_workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Demo
        env:
          SERVICE_INPUT: ${{ github.event.inputs.service }}
          VERSION_INPUT: ${{ github.event.inputs.version }}
          EVENT_TYPE_INPUT: ${{ github.event.inputs.event_type }}
        run: |
          # Sanitize inputs - only allow alphanumeric, dashes, underscores, dots, and forward slashes
          SERVICE=$(echo "$SERVICE_INPUT" | tr -cd 'a-zA-Z0-9-_./')
          VERSION=$(echo "$VERSION_INPUT" | tr -cd 'a-zA-Z0-9-_.')
          EVENT_TYPE=$(echo "$EVENT_TYPE_INPUT" | tr -cd 'a-zA-Z0-9-_')

          # Validate that inputs weren't empty after sanitization
          if [ -z "$SERVICE" ] || [ -z "$VERSION" ] || [ -z "$EVENT_TYPE" ]; then
            echo "Error: Invalid input detected"
            exit 1
          fi

          repo_owner="skylight-hq"
          repo_name="dibbs-tf-envs"

          response="$(curl -L -w '%{http_code}\n' -o /dev/null \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.DIBBS_SKYLIGHT_PAT }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/$repo_owner/$repo_name/dispatches \
            -d "{\"event_type\": \"$EVENT_TYPE\", \"client_payload\": {\"version\": \"$VERSION\", \"service\": \"$SERVICE\"}}")"
          if [ $response -ne 204 ]; then
            echo "Failed to trigger the workflow."
            exit 1
          fi
          echo "View your workflow run at: https://github.com/skylight-hq/dibbs-tf-envs/actions"
          echo "Successfully triggered the workflow."
